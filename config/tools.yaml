# 외부 도구 연동 설정
# 보안 점검(6단계)·QA 자동화(7단계)는 별도 repo의 스킬을 그대로 사용한다.
# 각 단계 에이전트는 아래 경로의 SKILL.md를 읽어 방법론을 따르고,
# 결과 레포트를 workspace/reports/ 로 가져온 뒤 리팩토링 요구서로 변환한다.

security_auditor:
  path: C:/code-security-auditor
  skill: .claude/skills/security-audit/SKILL.md
  command: /scan            # 원 repo에서의 명령 (참고용)

qa_automation:
  path: C:/qa-automation
  skill: .claude/skills/test-automation/SKILL.md
  command: /qa
