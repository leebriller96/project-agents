# 업무 분류 (1단계 산출물). workspace/<project>/slices/slices.yaml
# 사람이 승인(approved: true)해야 2단계 이후가 진행된다.
approved: false
approved_by:
approved_at:

slices:
  - id: common-auth                  # 영문 소문자·하이픈. 패키지명/디렉토리명으로 쓰인다
    name: 인증/권한
    description: 로그인, 토큰 발급, 권한 검사
    priority: 1                      # 낮을수록 먼저
    depends_on: []                   # 다른 slice id. 병렬 실행 판단에 쓰인다
    traits: [auth]                   # 검증 축을 결정하는 특성 (아래 표). 없으면 빈 배열
    entities: [User, Role]           # 주요 엔티티 (PROJECT_BRIEF 의 엔티티 목록과 일치)
    screens: [SCR-001 로그인]        # 화면 목록 (화면 ID + 이름)
    apis: ["POST /auth/login", "POST /auth/refresh"]
    requirements: [REQ-001, REQ-002] # 요구사항 ID (추적표에 쓰인다)
    sources:                         # 근거 문서 (문서명#절)
      - 요구사항정의서.docx#3.1
    asis:                            # mode=migration 일 때: AS-IS 매핑
      packages: [com.legacy.login]
      tables: [TB_USER, TB_ROLE]
      programs: [LoginAction.java]

  - id: order
    name: 주문
    description: 주문 생성·조회·취소
    priority: 2
    depends_on: [common-auth]
    traits: [transaction, counter]
    entities: [Order, OrderItem]
    screens: [SCR-010 주문목록, SCR-011 주문상세]
    apis: ["GET /orders", "POST /orders", "DELETE /orders/{id}"]
    requirements: [REQ-010, REQ-011]
    sources: []
    asis: {}

unassigned:                          # 어느 slice 에도 넣지 못한 항목 (사람 판단 필요)
  entities: []
  screens: []
  requirements: []

# traits — 이 slice 가 반드시 닫아야 하는 검증 축을 정한다 (tools/gate.py 의 coverage-axis 훅이 대조).
# 실측 근거: 파이프라인이 스스로 만든 결함은 전부 "앞 단계가 보지 못한 축" 에서만 잡혔다.
#
#   trait                  요구 축            왜 (실측)
#   file-upload            real-server        서블릿·파서가 서비스보다 먼저 갈린다 (multipart NUL 500, 413)
#   transaction            real-db            H2 로는 안 보이는 방언·캐스트 (Timestamp, H2 URL override)
#   batch                  real-db
#   counter                concurrency        조회수·시퀀스 (REQUIRES_NEW 커넥션 2중 점유 교착)
#   concurrency-sensitive  concurrency
#   rich-text              browser            jsdom 이 못 잡는 로드 즉시 크래시 (Tiptap)
#   dom-heavy              browser
#   auth                   real-server        필터·프록시 경로 (XFF 위조 허용)
#   proxy-header           real-server
#   external-io            real-server
#   sanitizer              security-static
#
# 모든 slice 는 기본으로 unit 축을 요구한다(그 위 축은 traits 가 요구할 때만). 매핑을 바꾸려면 config/project.yaml 의
# verification.trait_axes 에 덮어쓴다.
